<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>우리 채팅방</title>
<style>
:root{--bg:#fff;--fg:#1c1c1e;--me:#fee500;--other:#eee;--bar:#f6f6f6;--sub:#888;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#121212;--fg:#f2f2f2;--me:#c9b400;--other:#2a2a2a;--bar:#1c1c1c;--sub:#999}}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;display:flex;flex-direction:column}
header{padding:12px 16px;background:var(--bar);display:flex;justify-content:space-between;align-items:center;font-weight:600}
header button{font-size:13px;padding:6px 12px}
#list{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.m{max-width:75%;padding:8px 12px;border-radius:14px;background:var(--other);word-break:break-word;align-self:flex-start;white-space:pre-wrap}
.m.me{background:var(--me);align-self:flex-end;color:#1c1c1c}
.n{font-size:11px;color:var(--sub);margin-bottom:2px}
.row{display:flex;gap:8px;padding:8px;background:var(--bar)}
input{flex:1;min-width:0;padding:10px 12px;border-radius:20px;border:1px solid #8884;background:var(--bg);color:var(--fg);font-size:16px}
button{padding:0 16px;min-height:40px;border:0;border-radius:20px;background:var(--me);color:#1c1c1c;font-weight:600;font-size:15px}
#note{padding:20px;text-align:center;color:var(--sub)}
</style>
</head>
<body>
<header><span>💬 우리 채팅방</span><span><button id="chg">닉네임 변경</button> <button id="copy">링크 복사</button></span></header>
<div id="list"><div id="note">연결 중…</div></div>
<div class="row" id="nickrow"><input id="nick" placeholder="닉네임을 정하세요" maxlength="12"><button id="nickbtn">확인</button></div>
<div class="row" id="sendrow" style="display:none"><input id="txt" placeholder="메시지 입력" autocomplete="off" maxlength="500"><button id="send">전송</button></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
// ▼▼▼ 여기에 Firebase 설정 값을 붙여넣으세요 ▼▼▼
var firebaseConfig = {
  apiKey: "AIzaSyAsqjLkmLy9m_976ITBPnYb1vmtKK6YXiA",
  authDomain: "friend-chat4317.firebaseapp.com",
  databaseURL: "https://friend-chat4317-default-rtdb.firebaseio.com",
  projectId: "friend-chat4317",
  appId: "1:952980541430:web:81606b50d69319fa4181d7"
};
// ▲▲▲ 여기까지 ▲▲▲

(function(){
  var list=document.getElementById('list');
  var nickEl=document.getElementById('nick'),nickRow=document.getElementById('nickrow'),sendRow=document.getElementById('sendrow'),txt=document.getElementById('txt');

  // 방 이름: 주소 뒤 #코드. 없으면 길고 추측 불가능한 코드를 새로 만듦
  var room=location.hash.slice(1);
  if(!room||room.length<12){
    var a=new Uint8Array(16);crypto.getRandomValues(a);
    room=Array.from(a,function(b){return b.toString(16).padStart(2,'0')}).join('');
    location.hash=room;
  }

  // 내 기기 구분용 ID (이 기기에서 보낸 메시지를 오른쪽에 표시)
  var uid='';
  try{uid=localStorage.getItem('uid')||'';}catch(e){}
  if(!uid){uid=Math.random().toString(36).slice(2)+Date.now().toString(36);try{localStorage.setItem('uid',uid)}catch(e){}}
  var nick='';
  try{nick=localStorage.getItem('nick')||'';}catch(e){}
  nickEl.value=nick;
  function ready(){nickRow.style.display='none';sendRow.style.display='flex';}
  if(nick)ready();
  document.getElementById('nickbtn').onclick=function(){
    var v=nickEl.value.trim();if(!v)return;nick=v;
    try{localStorage.setItem('nick',nick)}catch(e){}
    ready();
  };

  document.getElementById('chg').onclick=function(){sendRow.style.display='none';nickRow.style.display='flex';nickEl.value=nick;nickEl.focus();};
  document.getElementById('copy').onclick=function(){
    var b=this;
    function done(){b.textContent='복사됨!';setTimeout(function(){b.textContent='링크 복사'},1500);}
    if(navigator.clipboard){navigator.clipboard.writeText(location.href).then(done,function(){prompt('링크를 복사하세요',location.href)});}
    else prompt('링크를 복사하세요',location.href);
  };

  if(firebaseConfig.apiKey.indexOf('여기에')===0){
    list.innerHTML='<div id="note">Firebase 설정 값이 아직 없어요.<br>index.html 위쪽 firebaseConfig에 붙여넣어 주세요.</div>';
    return;
  }

  firebase.initializeApp(firebaseConfig);
  var ref=firebase.database().ref('rooms/'+room);

  function render(items){
    list.innerHTML='';
    if(!items.length){list.innerHTML='<div id="note">첫 메시지를 보내보세요!<br>위의 [링크 복사]로 친구에게 주소를 보내면 돼요.</div>';return;}
    items.forEach(function(m){
      var b=document.createElement('div');b.className='m'+(m.uid===uid?' me':'');
      var n=document.createElement('div');n.className='n';
      var t=new Date(m.ts||0);
      n.textContent=(m.name||'')+' · '+t.getHours()+':'+String(t.getMinutes()).padStart(2,'0');
      var x=document.createElement('div');x.textContent=m.text||'';
      b.appendChild(n);b.appendChild(x);list.appendChild(b);
    });
    list.scrollTop=list.scrollHeight;
  }

  ref.orderByChild('ts').limitToLast(200).on('value',function(snap){
    var arr=[];
    snap.forEach(function(c){arr.push(c.val());});
    render(arr);
  },function(){list.innerHTML='<div id="note">불러오기 실패. 설정 값과 규칙을 확인하세요.</div>';});

  function send(){
    var v=txt.value.trim();if(!v)return;txt.value='';
    ref.push({name:nick,text:v,uid:uid,ts:firebase.database.ServerValue.TIMESTAMP}).catch(function(){alert('전송 실패');});
  }
  document.getElementById('send').onclick=send;
  txt.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.isComposing){e.preventDefault();send();}});
})();
</script>
</body>
</html>
